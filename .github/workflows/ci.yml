name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # One platform failing must not mask results on the others — win32-only
      # breakage is exactly what this matrix exists to surface.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # frozen-lockfile: CI must test the exact dependency set that ships,
      # never a silently-refreshed resolution.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun test

      # The build script's `chmod +x` is posix-only, and dist is built and
      # published from posix anyway — so the build gate runs everywhere but
      # Windows, where the test + typecheck gates are the ones that matter.
      - if: runner.os != 'Windows'
        run: bun run build
